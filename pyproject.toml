[project]
name = "TRAMIL"
version = "0.0.1"
description = "Residual semantic prior bipartite MIL for depression detection on E-DAIC"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "pandas", "torch", "opensmile", "sentence-transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
